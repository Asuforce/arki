name: deploy

# main の ci が成功したあとに本番へデプロイする。実際の値（D1 の ID、ドメインなど）は
# リポジトリに置かず、GitHub の repository variables / secrets から渡す。
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  backend:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # wrangler.toml.example の build は毎回 worker-build をソースからビルドして遅いので、
      # インストール済みのバイナリを cache して使う（worker のバージョンが変われば作り直す）。
      - name: Cache worker-build
        id: worker-build
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
      - name: Install worker-build
        if: steps.worker-build.outputs.cache-hit != 'true'
        run: cargo install --locked worker-build@^0.8
      - name: Generate wrangler.toml
        env:
          D1_DATABASE_ID: ${{ vars.ARKI_D1_DATABASE_ID }}
          BLOG_ORIGIN: ${{ vars.ARKI_BLOG_ORIGIN }}
          IMAGE_BASE_URL: ${{ vars.ARKI_IMAGE_BASE_URL }}
        run: |
          test -n "$D1_DATABASE_ID" && test -n "$BLOG_ORIGIN" && test -n "$IMAGE_BASE_URL"
          sed -e 's|^command = .*|command = "worker-build --release"|' \
              -e "s|<YOUR_D1_DATABASE_ID>|$D1_DATABASE_ID|" \
              -e "s|https://<your-blog-domain>|$BLOG_ORIGIN|" \
              -e "s|https://<your-image-domain>|$IMAGE_BASE_URL|" \
              wrangler.toml.example > wrangler.toml
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npx wrangler deploy

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    env:
      PUBLIC_API_URL: ${{ vars.ARKI_API_URL }}
      PUBLIC_IMAGE_BASE_URL: ${{ vars.ARKI_IMAGE_BASE_URL }}
      PUBLIC_SITE_TITLE: ${{ vars.ARKI_SITE_TITLE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy --config dist/server/wrangler.json
